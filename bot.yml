name: run-bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Függőségek telepítése
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bot futtatása
        env:
          FC_EMAIL: ${{ secrets.FC_EMAIL }}
          FC_PASS: ${{ secrets.FC_PASS }}
        run: |
          python bot.py
